<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="How I work: source data to SQL to Python to dashboards to delivery">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2DD4BF"/>
    </marker>
  </defs>
  <rect width="1200" height="190" rx="16" fill="#0B1F33"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="25" y="45" width="190" height="100" rx="12" fill="#FFFFFF" fill-opacity="0.07" stroke="#2DD4BF" stroke-opacity="0.5"/>
    <text x="120" y="85" font-size="19" font-weight="700" fill="#FFFFFF">Source data</text>
    <text x="120" y="112" font-size="13" fill="#CBD5E1">Zoho, APIs, partner files</text>

    <rect x="265" y="45" width="190" height="100" rx="12" fill="#FFFFFF" fill-opacity="0.07" stroke="#2DD4BF" stroke-opacity="0.5"/>
    <text x="360" y="85" font-size="19" font-weight="700" fill="#FFFFFF">SQL</text>
    <text x="360" y="112" font-size="13" fill="#CBD5E1">Clean, join, model</text>

    <rect x="505" y="45" width="190" height="100" rx="12" fill="#FFFFFF" fill-opacity="0.07" stroke="#2DD4BF" stroke-opacity="0.5"/>
    <text x="600" y="85" font-size="19" font-weight="700" fill="#FFFFFF">Python</text>
    <text x="600" y="112" font-size="13" fill="#CBD5E1">Pandas, API automation</text>

    <rect x="745" y="45" width="190" height="100" rx="12" fill="#FFFFFF" fill-opacity="0.07" stroke="#2DD4BF" stroke-opacity="0.5"/>
    <text x="840" y="85" font-size="19" font-weight="700" fill="#FFFFFF">Dashboards</text>
    <text x="840" y="112" font-size="13" fill="#CBD5E1">Zoho Analytics, Power BI</text>

    <rect x="985" y="45" width="190" height="100" rx="12" fill="#2DD4BF" fill-opacity="0.18" stroke="#2DD4BF"/>
    <text x="1080" y="85" font-size="19" font-weight="700" fill="#FFFFFF">Delivery</text>
    <text x="1080" y="112" font-size="13" fill="#CBD5E1">WhatsApp, email, MIS</text>
  </g>
  <g stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#arr)">
    <line x1="217" y1="95" x2="261" y2="95"/>
    <line x1="457" y1="95" x2="501" y2="95"/>
    <line x1="697" y1="95" x2="741" y2="95"/>
    <line x1="937" y1="95" x2="981" y2="95"/>
  </g>
